spring:
  datasource:
    url: jdbc:mysql://localhost:3306/todak?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    show-sql: true

jwt:
  secret: ${JWT_SECRET}   # 32자 이상 랜덤 문자열 (환경변수로 주입)
  expiration: 604800000   # 7일 (ms)

kakao:
  client-id: ${KAKAO_CLIENT_ID}       # 카카오 디벨로퍼스 REST API 키
  redirect-uri: ${KAKAO_REDIRECT_URI} # 등록한 Redirect URI

springdoc:
  swagger-ui:
    path: /swagger-ui.html